name: Bug
description: Report observable behavior that differs from expectations.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations: {required: true}
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations: {required: true}
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions without secrets.
    validations: {required: true}
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations: {required: true}
